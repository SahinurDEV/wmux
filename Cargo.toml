[workspace]
resolver = "2"
members = [
    "crates/conpty",
    "crates/process-manager",
    "crates/session-manager",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
windows-sys = "0.59"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
