version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      xterm:
        patterns: ["@xterm/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
