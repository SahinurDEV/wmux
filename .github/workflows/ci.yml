name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (rustfmt, clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: Build, test, package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm --filter @wmux/desktop typecheck
      - name: Frontend unit tests
        run: pnpm --filter @wmux/desktop test

      - name: Rust tests (ConPTY, process manager, SQLite, shells)
        run: cargo test --workspace -- --nocapture

      - name: Build installers (NSIS + MSI)
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $out = "target/release/portable/Wmux"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/wmux-desktop.exe "$out/Wmux.exe"
          Copy-Item LICENSE, README.md $out
          Compress-Archive -Path "$out/*" -DestinationPath target/release/Wmux-portable-x64.zip -Force

      - name: End-to-end tests (real app, real shells)
        shell: pwsh
        run: node tests/e2e/run.mjs target/release/wmux-desktop.exe

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: wmux-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/Wmux-portable-x64.zip
          if-no-files-found: error
