name: Bug report
description: Something in Wmux does not work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace
        2. Split the pane to the right
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wmux version
      description: Shown in the status bar and under Settings > Advanced.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` to find it.
      placeholder: "Windows 11 24H2 (26100)"
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      multiple: true
      options:
        - PowerShell 7
        - Windows PowerShell
        - Command Prompt
        - WSL
        - Git Bash
        - Custom
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logs are in `%LOCALAPPDATA%\dev.wmux.desktop\logs`. Remove anything sensitive before pasting.
      render: text
